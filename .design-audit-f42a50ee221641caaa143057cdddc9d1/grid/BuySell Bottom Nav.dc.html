<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Categories&quot;,&quot;Sell&quot;,&quot;Orders&quot;,&quot;Account&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const items = ['Home', 'Categories', 'Sell', 'Orders', 'Account'];
    const active = this.props.active ?? 'Home';
    const base = 'flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding-bottom:10px;';
    const out = {};
    items.forEach((n, i) => {
      out['s' + i] = base + (n === active ? 'color:#0B6B3A' : 'color:#9AA39D');
    });
    out.sellIcon = 'width:26px;height:26px;border-radius:50%;background:' + (active === 'Sell' ? '#0B6B3A' : '#0B6B3A') + ';color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-1px';
    return out;
  }
}
</script>
