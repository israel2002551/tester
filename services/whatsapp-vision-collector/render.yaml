services:
  - type: web
    name: buysell-whatsapp-vision-collector
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: WHATSAPP_INGEST_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: WHATSAPP_LISTINGS_SELLER_ID
        value: e525b6d9-4f81-4522-822d-119151671dba
      - key: PUBLIC_SITE_URL
        sync: false
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      - key: MAX_MEDIA_BYTES
        value: "26214400"
      - key: WHATSAPP_MONITOR_ALL_GROUPS
        value: "true"
      - key: WHATSAPP_MEDIA_INTAKE_CONCURRENCY
        value: "2"
      - key: WHATSAPP_STAGING_CONCURRENCY
        value: "2"
      - key: WHATSAPP_LISTING_WORKER_CONCURRENCY
        value: "1"
      - key: WHATSAPP_QUEUE_POLL_MS
        value: "3000"
      - key: WHATSAPP_PRICE_FOLLOWUP_WINDOW_MS
        value: "600000"
      - key: WHATSAPP_TRANSCRIBE_VIDEO_AUDIO
        value: "true"
      - key: MAX_AUDIO_TRANSCRIBE_BYTES
        value: "24000000"
