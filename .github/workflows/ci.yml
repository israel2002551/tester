name: BUYSELL CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, rebuild/production-architecture]

permissions:
  contents: read

concurrency:
  group: buysell-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://buysell:buysell@127.0.0.1:5432/buysell?schema=public
      DIRECT_DATABASE_URL: postgresql://buysell:buysell@127.0.0.1:5432/buysell?schema=public
      VITE_API_BASE_URL: /api/v1
      VITE_DEMO_MODE: "false"
      ALLOW_DEV_AUTH: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Scan for committed secrets
        run: npm run verify:secrets

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build and verify public boundary
        run: npm run build
