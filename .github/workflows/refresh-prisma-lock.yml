name: Refresh Prisma lockfiles

on:
  push:
    branches: [rebuild/production-architecture]
    paths:
      - backend/package.json

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/production-architecture

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm

      - name: Refresh root workspace lockfile
        run: npm install --package-lock-only

      - name: Refresh backend standalone lockfile
        working-directory: backend
        run: npm install --package-lock-only --workspaces=false

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
          else
            git commit -m "chore: refresh Prisma lockfiles"
            git push origin HEAD:rebuild/production-architecture
          fi
